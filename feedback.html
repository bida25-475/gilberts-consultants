<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Feedback | Kalahari Tech</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>


    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand"
               href="index.html">

                Kalahari Tech

            </a>

        </div>

    </nav>



    <!-- Feedback Form -->
    <section class="container mt-5">

        <h1 class="text-center mb-4">

            Customer Feedback

        </h1>


        <form>


            <div class="mb-3">

                <label>
                    Full Name
                </label>

                <input type="text"
                       class="form-control"
                       required>

            </div>



            <div class="mb-3">

                <label>
                    Email Address
                </label>

                <input type="email"
                       class="form-control"
                       required>

            </div>



            <div class="mb-3">

                <label>
                    Message
                </label>

                <textarea class="form-control"
                          rows="5"
                          required>
                </textarea>

            </div>



            <button type="submit"
                    class="btn btn-primary">

                Submit Feedback

            </button>


        </form>



        <div class="text-center mt-5">

            <a href="index.html"
               class="btn btn-dark">

                Back Home

            </a>

        </div>

    </section>


</body>

</html>
